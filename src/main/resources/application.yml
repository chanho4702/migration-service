server:
  port: 9170
spring:
  application:
    name: migration-service
  datasource:
    url: ${MIGRATION_DB_URL:jdbc:postgresql://localhost:5433/migrationdb}
    username: ${MIGRATION_DB_USERNAME:keycloak}
    password: ${MIGRATION_DB_PASSWORD:keycloak}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9000/.well-known/jwks.json}

springdoc:
  # 내부 전용 표면은 문서에 넣지 않는다. @RestController면 springdoc이 무조건 스캔하므로,
  # 컨트롤러마다 빼는 대신 경로로 한 번에 끊는다 — 나중에 누가 /internal 컨트롤러를 더 만들어도
  # 공개 API 레퍼런스로 새지 않는다(수집기가 이 스펙을 그대로 문서 위키에 싣는다).
  paths-to-exclude: /internal/**
  # 컨트롤러가 선언한 것과 OpenApiConfig의 공통 오류만 문서에 남긴다. 기본값(true)이면
  # common-starter의 @RestControllerAdvice 핸들러가 모든 오퍼레이션에 400/409/415/503을
  # 영문 설명과 Map<String,String> 스키마로 붙여, 생성기가 실제 계약과 다른 표를 그린다.
  override-with-generic-response: false
  # 키 정렬 고정 — 수집한 스펙 JSON을 커밋하므로 diff가 코드 변경만 반영해야 한다.
  writer-with-order-by-keys: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

platform:
  jwt:
    issuer: ${PLATFORM_ISSUER:http://localhost:9000}
    audience: ${PLATFORM_AUDIENCE:platform-api}
  org-grpc:
    host: ${ORG_GRPC_HOST:localhost}
    port: ${ORG_GRPC_PORT:9131}
  migration:
    wiki:
      # 위키 내부 import API. 게이트웨이·nginx를 거치지 않는 내부망 주소다 —
      # 이 요청에는 내부 토큰이 붙으므로 외부에 노출된 주소를 넣으면 안 된다.
      base-uri: ${WIKI_BACKEND_URI:http://localhost:9110}
      internal-token: ${WIKI_INTERNAL_TOKEN:}
      connect-timeout: ${WIKI_IMPORT_CONNECT_TIMEOUT:PT10S}
      request-timeout: ${WIKI_IMPORT_REQUEST_TIMEOUT:PT60S}
    # 첨부 바이트를 위키로 올리기 전에 잠시 두는 자리. 컨테이너에서는 볼륨을 붙인다 —
    # 재시작으로 사라지면 다음 시도가 원본에서 같은 파일을 다시 내려받는다.
    staging-dir: ${MIGRATION_STAGING_DIR:./data/migration-staging}
    dc:
      page-size: ${MIGRATION_DC_PAGE_SIZE:100}
      max-attachment-bytes: ${MIGRATION_MAX_ATTACHMENT_BYTES:104857600}
      history-versions: ${MIGRATION_HISTORY_VERSIONS:10}
      max-history-version-bytes: ${MIGRATION_MAX_HISTORY_VERSION_BYTES:2097152}
    worker:
      enabled: ${MIGRATION_WORKER_ENABLED:true}

logging:
  level:
    root: INFO

---
# dev 오프셋 클러스터(운영 포트 +10000, 루트 확정 결정) — 도커 스택과 공존. scripts/dev-up-local.ps1가 이 프로필로 띄운다.
spring:
  config:
    activate:
      on-profile: dev
server:
  port: 19170
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:18761/eureka}
platform:
  jwt:
    issuer: ${PLATFORM_ISSUER:http://localhost:19000}
  org-grpc:
    port: ${ORG_GRPC_PORT:19131}
  migration:
    wiki:
      base-uri: ${WIKI_BACKEND_URI:http://localhost:19110}
---
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    enabled: ${MIGRATION_EUREKA_ENABLED:true}
logging:
  # 앱은 stdout JSON만 낸다 — Alloy → Loki → Grafana가 수집한다(루트 확정 결정).
  structured:
    format:
      console: ecs

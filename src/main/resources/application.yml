server:
  port: 9140
spring:
  application:
    name: migration-service
  datasource:
    url: ${MIGRATION_DB_URL:jdbc:postgresql://localhost:5433/migrationdb}
    username: ${MIGRATION_DB_USERNAME:keycloak}
    password: ${MIGRATION_DB_PASSWORD:keycloak}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9000/.well-known/jwks.json}

springdoc:
  # common-starter의 @RestControllerAdvice가 모든 오퍼레이션에 영문 400/409/503을 붙이지 않게 한다
  # (wiki-backend와 같은 이유·같은 설정).
  override-with-generic-response: false
  writer-with-order-by-keys: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

platform:
  jwt:
    issuer: ${PLATFORM_ISSUER:http://localhost:9000}
    audience: ${PLATFORM_AUDIENCE:platform-api}
  org-grpc:
    host: ${ORG_GRPC_HOST:localhost}
    port: ${ORG_GRPC_PORT:9131}
  migration:
    wiki:
      # 위키 내부 import API. 게이트웨이·nginx를 거치지 않는 내부망 주소다 —
      # 이 요청에는 내부 토큰이 붙으므로 외부에 노출된 주소를 넣으면 안 된다.
      base-uri: ${WIKI_BACKEND_URI:http://localhost:9110}
      internal-token: ${WIKI_INTERNAL_TOKEN:}
      connect-timeout: ${WIKI_IMPORT_CONNECT_TIMEOUT:PT10S}
      request-timeout: ${WIKI_IMPORT_REQUEST_TIMEOUT:PT60S}
    # 첨부 바이트를 위키로 올리기 전에 잠시 두는 자리. 컨테이너에서는 볼륨을 붙인다 —
    # 재시작으로 사라지면 다음 시도가 원본에서 같은 파일을 다시 내려받는다.
    staging-dir: ${MIGRATION_STAGING_DIR:./data/migration-staging}
    dc:
      page-size: ${MIGRATION_DC_PAGE_SIZE:100}
      max-attachment-bytes: ${MIGRATION_MAX_ATTACHMENT_BYTES:104857600}
      history-versions: ${MIGRATION_HISTORY_VERSIONS:10}
      max-history-version-bytes: ${MIGRATION_MAX_HISTORY_VERSION_BYTES:2097152}
    worker:
      enabled: ${MIGRATION_WORKER_ENABLED:true}

logging:
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    enabled: ${MIGRATION_EUREKA_ENABLED:true}
logging:
  # 앱은 stdout JSON만 낸다 — Alloy → Loki → Grafana가 수집한다(루트 확정 결정).
  structured:
    format:
      console: ecs

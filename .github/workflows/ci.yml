name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # GHCR 이미지 push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # 이미지 버전 스탬프 — /actuator/info의 build.version이 이 값이 되고,
      # 관리자 대시보드 헬스 집계 표의 "버전" 열이 그걸 읽는다.
      # 형식 <짧은sha 7자리>-<YYYYMMDD>. GHCR의 sha-<전체sha> 태그와 같은 커밋을 가리킨다.
      - name: Version stamp
        id: ver
        run: echo "app=${GITHUB_SHA::7}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - run: ./gradlew build --no-daemon -PappVersion=${{ steps.ver.outputs.app }}
        env:
          GITHUB_ACTOR: chanho4702
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chanho4702/migration-service:latest
            ghcr.io/chanho4702/migration-service:sha-${{ github.sha }}

      - name: Dispatch deploy
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: chanho4702/infra-settings
          event-type: deploy
          client-payload: '{"service":"migration-service","sha":"${{ github.sha }}","run_id":"${{ github.run_id }}","repo":"${{ github.repository }}"}'

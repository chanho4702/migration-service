name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # GHCR 이미지 push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
        env:
          GITHUB_ACTOR: chanho4702
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chanho4702/migration-service:latest
            ghcr.io/chanho4702/migration-service:sha-${{ github.sha }}

      - name: Dispatch deploy
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: chanho4702/infra-settings
          event-type: deploy
          client-payload: '{"service":"migration-service","sha":"${{ github.sha }}","run_id":"${{ github.run_id }}","repo":"${{ github.repository }}"}'
